name: Feature request
description: A new capability or a change to existing behaviour.
labels: [needs-triage]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Mobile app
        - Backend
        - CI
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
