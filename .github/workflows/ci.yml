name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same PR or branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Pushes to main run everything, so main is always verified as a whole.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "$changed"
          # A workflow change re-runs both sides so the edited jobs are exercised before merge.
          workflow=$(echo "$changed" | grep -q '^\.github/' && echo true || echo false)
          mobile=$(echo "$changed" | grep -q '^mobile/' && echo true || echo "$workflow")
          backend=$(echo "$changed" | grep -q '^backend/' && echo true || echo "$workflow")
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

  mobile:
    name: Mobile (unit tests, lint, build)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      # gradle-daemon-jvm.properties asks for a Java 25 daemon; providing it avoids a toolchain download.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, debug build
        run: ./gradlew testDebugUnitTest lint assembleDebug
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-reports
          path: |
            mobile/app/build/reports/
            mobile/app/build/test-results/
          retention-days: 7

  backend:
    name: Backend (pytest)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Matches the python:3.12-slim base image in backend/Dockerfile.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest

  # The only check the main ruleset requires. A required job skipped by the path filter
  # would leave the PR waiting forever, so this job always runs and accepts skips.
  ci-passed:
    name: ci-passed
    if: always()
    needs: [changes, mobile, backend]
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          MOBILE: ${{ needs.mobile.result }}
          BACKEND: ${{ needs.backend.result }}
        run: |
          echo "changes=$CHANGES mobile=$MOBILE backend=$BACKEND"
          [ "$CHANGES" = "success" ] || exit 1
          for result in "$MOBILE" "$BACKEND"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
